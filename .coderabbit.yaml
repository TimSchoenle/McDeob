# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
tone_instructions: "Direct, no filler, no praise."

reviews:
  profile: assertive

  auto_review:
    # CodeRabbit cannot filter by head branch, so automated pull requests are
    # skipped by author: Renovate opens `renovate/*`, the release manager app
    # opens `release-please--*`. Both the bot login and the bare app slug are
    # listed because the match is exact.
    ignore_usernames:
      - "renovate[bot]"
      - "renovate"
      - "automatic-release-manager[bot]"
      - "automatic-release-manager"

  # Generated or tool-owned files. Review their sources instead.
  path_filters:
    - "!gradle/wrapper/gradle-wrapper.jar"
    - "!gradlew"
    - "!gradlew.bat"
    - "!**/build/**"
    - "!CHANGELOG.md"
    - "!.release-please-manifest.json"

  path_instructions:
    - path: "**/src/main/java/**/*.java"
      instructions: |
        Java 21 desktop application (JavaFX UI and picocli CLI) that downloads Minecraft artifacts from
        Mojang's launcher metadata, remaps them and decompiles them, also shipped as a GraalVM native image.
        Flag:
        - Downloads: every fetched file must be verified against the manifest SHA-1 and size before use;
          HTTP responses and bodies closed; timeouts set; partial files removed on failure.
        - Filesystem: paths derived from manifest data or jar entries must not escape the output
          directory; temp files and directories cleaned up; streams, jars and zip files in
          try-with-resources.
        - Concurrency: long-running work off the JavaFX application thread, UI updates only via
          `Platform.runLater`; shared state across worker threads synchronised; `InterruptedException`
          restores the interrupt flag; executors shut down.
        - External processes (`ProcessBuilder`): argument lists only, no shell strings built from input.
        - Reflection, resources or dynamic class loading added without a matching entry in
          `src/main/resources/META-INF/native-image/**`, which breaks the native build.
        - Null-safety (`@Nullable` from JetBrains annotations), exceptions that lose the cause, and errors
          logged and swallowed where the caller needs to fail.
        Prefer plain loops over the Stream API. Lombok is applied to every module: suggest it instead of
        hand-written constructors, getters, builders or loggers.
    - path: "{common,launchermeta}/src/main/java/**/*.java"
      instructions: |
        Library modules consumed by the app through shadow jars. `RequestModule.createHttpClient()` and the
        `LauncherMeta` constructor expose OkHttp on the public API; flag API changes that ripple into the
        app, and Jackson model changes that no longer tolerate unknown or missing manifest fields.
    - path: "src/main/java/com/shanebeestudios/mcdeop/app/**"
      instructions: |
        JavaFX UI. Check thread confinement, listener and binding leaks, disabled states while a job runs,
        and that errors reach the user instead of only the log.
    - path: "src/main/resources/META-INF/native-image/**"
      instructions: |
        Hand-maintained GraalVM reachability metadata. Check that every entry still matches a class or
        resource that exists, and that new reflective access in the diff is covered.
    - path: "**/src/test/java/**/*.java"
      instructions: |
        JUnit Jupiter tests. Require assertions on behaviour, not just absence of exceptions; flag tests
        that cannot fail, real network access, and filesystem state not confined to `@TempDir`.
    - path: "**/*.gradle.kts"
      instructions: |
        Build logic. Flag eager task configuration, configuration-cache incompatible constructs,
        undeclared task inputs/outputs, and changes to the native-image, shadow or dependency
        substitution setup.
    - path: ".github/{workflows,actions}/**"
      instructions: |
        Every third-party action must be pinned to a full commit SHA with a version comment.
        Require least-privilege `permissions:` at workflow or job level, `persist-credentials: false`
        on checkout unless pushing, no untrusted `${{ github.event.* }}` interpolation into `run:`,
        and no `pull_request_target` that checks out or executes PR code. Signing secrets must be
        scoped to the steps that sign.
    - path: "hooks/**"
      instructions: |
        Bash git hooks. Require `set -euo pipefail` where compatible with the hook contract, quoted
        expansions, and that the allowed commit types match release-please-config.json.

  pre_merge_checks:
    title:
      mode: error
      requirements: |
        Must follow Conventional Commits: `type(scope)?!?: subject`. Allowed types: feat, fix, perf,
        revert, docs, refactor, test, style, ci, build, chore, deps. Lowercase, imperative subject,
        no trailing period. release-please derives version bumps and the changelog from this title.

  tools:
    # CI runs only Spotless; no Checkstyle, PMD or equivalent static analysis.
    pmd:
      enabled: true
    # styles.css is JavaFX CSS (`-fx-*` properties), which web CSS linters reject.
    stylelint:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
