[versions]
jacksonDatabind = "2.22.2"
okhttp = "5.5.0"
reconstruct = "1.3.27"
vineflower = "1.12.0"
jadx = "1.5.6"
slf4j = "2.0.18"
picocli = "4.7.7"
javafx = "21.0.4"
junit = "6.1.3"
junitPlatform = "6.1.3"

# annotations referenced by decompiled sources, only used to generate the base project.
# these are the newest known versions; older ones are pinned per release date in the registry
jetbrainsAnnotations = "26.1.0"
jsr305 = "3.0.2"
jspecify = "1.0.1"

# plugins
lombok = "9.5.0"
spotless = "8.10.1"
shadow = "9.6.1"
buildconfig = "6.0.10"
javafxplugin = "0.1.0"
gluonfx = "1.0.29"
foojay-resolver = "1.0.0"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jacksonDatabind" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
reconstruct-common = { module = "io.github.lxgaming:reconstruct-common", version.ref = "reconstruct" }
vineflower = { module = "org.vineflower:vineflower", version.ref = "vineflower" }
jadx-core = { module = "io.github.skylot:jadx-core", version.ref = "jadx" }
jadx-java-input = { module = "io.github.skylot:jadx-java-input", version.ref = "jadx" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

# Not consumed as dependencies: the generated Gradle project declares these itself, pinned per
# Minecraft release date in AnnotationLibraryRegistry. The entries exist so Renovate knows the
# coordinates and keeps the newest-known version in [versions] current.
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

[plugins]
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
javafxplugin = { id = "org.openjfx.javafxplugin", version.ref = "javafxplugin" }
gluonfx = { id = "com.gluonhq.gluonfx-gradle-plugin", version.ref = "gluonfx" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }