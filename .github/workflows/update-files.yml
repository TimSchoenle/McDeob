name: Update Files

on:
    pull_request:
        branches: [ master ]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: { }

# Spotless runs through ./gradlew, so on a pull request it runs that pull request's wrapper, build
# scripts and plugins. Code running in a job can read every credential that job holds, so the work
# is split in two:
#
# - auto-format runs Spotless with no secret and no write permission, and only uploads what it
#   changed as a patch artifact;
# - `commit-format` in update-files-commit.yml (a workflow_run workflow the pull request cannot
#   edit) mints the App token and commits that patch with common/commit-patch. It runs no repository
#   code: it checks out the head for git's objects only, and commit-patch refuses any path outside
#   allowed_paths.
jobs:
    auto-format:
        name: Auto-Format
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read # to fetch code
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
                with:
                    egress-policy: audit

            # The pull request head, not the merge commit: the patch is committed to the branch, so
            # it has to be computed against the commit the branch points at.
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    persist-credentials: false
                    ref: ${{ github.event.pull_request.head.sha }}

            -   name: Auto-Format Code
                id: spotless
                uses: TimSchoenle/actions/actions/java-gradle/auto-spotless@e4229b81c3c3c880b9561dc4d53bd87ccf49eaf3 # tag=actions-java-gradle-auto-spotless-v2.0.1
                with:
                    java_version: '25'
                    artifact_name: auto-spotless
