name: Generate

# Every file a tool writes rather than a person. Each generator job runs on the pull request's head
# and uploads a patch; the Generated Files job is the required check and fails while a patch is not
# committed yet or a generator failed. generate-commit.yaml, a workflow_run workflow the pull request
# cannot edit, commits the merged patch to the branch, and the run on that commit decides.
#
# Spotless runs through ./gradlew, so on a pull request it runs that pull request's wrapper, build
# scripts and plugins. The generator jobs therefore hold no secret and no write permission and hand
# on only a patch; the App key lives in generate-commit.yaml, which runs nothing from the checkout.
#
# No `paths` filter: the Generated Files check has to report on every pull request to be required.

on:
    pull_request:
        branches: [ master ]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: { }

jobs:
    auto-format:
        name: Auto-Format
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read # to fetch code
        outputs:
            has_changes: ${{ steps.spotless.outputs.changes_detected }}
            artifact_name: ${{ steps.spotless.outputs.artifact_name }}
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
                with:
                    egress-policy: audit

            # The pull request head, not the merge commit: the patch is committed to the branch, so
            # it has to be computed against the commit the branch points at.
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    persist-credentials: false
                    ref: ${{ github.event.pull_request.head.sha }}

            -   name: Auto-Format Code
                id: spotless
                uses: TimSchoenle/actions/actions/java-gradle/auto-spotless@c13315fe3d8db7f1de82306a9d56b35c4fbf0fbb # tag=actions-java-gradle-auto-spotless-v2.0.2
                with:
                    java_version: '25'
                    artifact_name: auto-spotless

    # The required check. It needs every generator above and runs whatever their result, so it
    # reports on every pull request.
    verdict:
        name: Generated Files
        needs: [ auto-format ]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read # to check out the commit the merged patch is made from
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
                with:
                    egress-policy: block
                    allowed-endpoints: >
                        github.com:443
                        api.github.com:443
                        *.actions.githubusercontent.com:443
                        *.blob.core.windows.net:443

            -   name: Generated Files Verdict
                uses: TimSchoenle/actions/actions/common/generated-files-verdict@927daf80ad493b627b7384abf496d83abbac5f43 # tag=actions-common-generated-files-verdict-v1.2.0
                with:
                    needs: ${{ toJSON(needs) }}
