name: Fork Push Probe

# Temporary experiment, removed once it has answered its question: can the maintenance App's
# installation token commit to the head branch of a pull request from a user-owned fork that allows
# edits by maintainers? If it can, Generate Commit could commit generated files to fork pull
# requests too instead of skipping them.
#
# Dispatch only, from the default branch. It checks out nothing and runs no code from the pull
# request; the only thing it writes is one probe file on the pull request's branch.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Number of the fork pull request to commit to'
        required: true
        type: number

permissions: {}

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ci
    permissions:
      pull-requests: read # to read the pull request's head repository and branch
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Read The Pull Request Head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls/${PR}" --jq '"repo=\(.head.repo.full_name)\nbranch=\(.head.ref)\nsha=\(.head.sha)\nmaintainer_can_modify=\(.maintainer_can_modify)"' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # Scoped to this repository only, like the token Generate Commit mints.
      - name: Generate App Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write

      # The same API commit-patch uses. A failure is the answer, not an error of the probe.
      - name: Commit To The Fork Branch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_REPO: ${{ steps.head.outputs.repo }}
          HEAD_BRANCH: ${{ steps.head.outputs.branch }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          QUERY: 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }'
        run: |
          set -euo pipefail
          contents="$(printf 'Committed by the Fork Push Probe in %s.\n' "$GITHUB_REPOSITORY" | base64 -w0)"
          input="$(jq -nc --arg repo "$HEAD_REPO" --arg branch "$HEAD_BRANCH" --arg sha "$HEAD_SHA" --arg contents "$contents" '{
            branch: { repositoryNameWithOwner: $repo, branchName: $branch },
            expectedHeadOid: $sha,
            message: { headline: "test: fork push probe" },
            fileChanges: { additions: [ { path: "fork-push-probe.txt", contents: $contents } ] }
          }')"
          body="$(jq -nc --arg query "$QUERY" --argjson input "$input" '{ query: $query, variables: { input: $input } }')"
          if result="$(gh api graphql --input - <<< "$body" 2>&1)"; then
            echo "RESULT: the App token committed to ${HEAD_REPO}:${HEAD_BRANCH}"
            echo "$result"
          else
            echo "RESULT: the App token could not commit to ${HEAD_REPO}:${HEAD_BRANCH}"
            echo "$result"
            exit 1
          fi
