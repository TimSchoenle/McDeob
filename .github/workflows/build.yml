name: Build

on:
    push:
        branches: [ 'master' ]
    pull_request:
        branches: [ '**' ]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: { }

jobs:
    build:
        name: Build(${{ matrix.os }})
        strategy:
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read # to read code
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
                with:
                    egress-policy: audit

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    persist-credentials: false

            -   name: Setup Base Environment
                uses: $/.github/actions/setup-base-environment

            -   name: Build without test
                shell: bash
                run: ./gradlew build -x test

            -   name: Upload a Build Artifact
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    # Artifact name
                    name: McDeob-Artifact-${{ matrix.os }}
                    # A file, directory or wildcard pattern that describes what to upload
                    path: |
                        build/libs/McDeob-*-all.jar

    test:
        name: Test
        needs: [ build ]
        strategy:
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write # to write junit reports
            checks: write # to write junit reports
            id-token: write # to write junit reports
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
                with:
                    egress-policy: audit

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    persist-credentials: false

            -   name: Setup Base Environment
                uses: $/.github/actions/setup-base-environment

            -   name: Test
                run: ./gradlew test

            -   name: Publish Test Report
                uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
                if: success() || failure()
                with:
                    report_paths: '**/build/test-results/test/TEST-*.xml'

    # Kept apart from `test`, so a Codecov outage fails this job alone. The upload authenticates
    # with this job's OIDC token, so the job needs no environment and no secret.
    # `.github/codecov.yml` decides what the Codecov statuses check. Gradle runs on Java 25; the
    # tests still compile and run on the Java 21 toolchain that build.gradle.kts sets.
    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read # Required to checkout the code
            id-token: write # Required to authenticate the Codecov upload with OIDC
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
                with:
                    egress-policy: audit

            -   name: Run Coverage
                uses: TimSchoenle/actions/actions/java-gradle/coverage-codecov@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-java-gradle-coverage-codecov-v1.1.2
                with:
                    java_version: '25'
                    flags: java

    native:
        name: Native(${{ matrix.os }})
        environment: native-test
        needs: [ test ]
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read # to read code
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
                with:
                    egress-policy: audit

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    persist-credentials: false

            -   name: Build Native Executable
                id: native_build
                uses: $/.github/actions/build-native-with-graalvm

            -   name: Sign Native Artifact
                uses: $/.github/actions/sign-native-artifact
                with:
                    native_asset: ${{ steps.native_build.outputs.native_asset }}
                env:
                    COSGIN_PRIVATE_KEY: ${{ secrets.COSGIN_PRIVATE_KEY }}
                    COSGIN_PASSWORD: ${{ secrets.COSGIN_PASSWORD }}

            -   name: Upload Native Artifact
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                if: success()
                with:
                    name: McDeob-Native-${{ runner.os }}-${{ runner.arch }}
                    path: |
                        ${{ steps.native_build.outputs.native_asset }}
                        ${{ steps.native_build.outputs.native_asset }}.sigstore.json
                    if-no-files-found: error
