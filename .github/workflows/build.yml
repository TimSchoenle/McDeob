name: Build

on:
    push:
        branches: [ 'master' ]
    pull_request:
        branches: [ '**' ]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: { }

jobs:
    build:
        name: Build(${{ matrix.os }})
        strategy:
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        permissions:
            contents: read # to read code
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
                with:
                    egress-policy: audit

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    persist-credentials: false

            -   name: Setup Base Environment
                uses: $/.github/actions/setup-base-environment

            -   name: Build without test
                shell: bash
                run: ./gradlew build -x test

            -   name: Upload a Build Artifact
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    # Artifact name
                    name: McDeob-Artifact-${{ matrix.os }}
                    # A file, directory or wildcard pattern that describes what to upload
                    path: |
                        build/libs/McDeob-*-all.jar
                    if-no-files-found: error

    test:
        name: Test
        needs: [ build ]
        strategy:
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        permissions:
            contents: read # to fetch code
            checks: write # for action-junit-report to publish the test report as a check run
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
                with:
                    egress-policy: audit

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    persist-credentials: false

            -   name: Setup Base Environment
                uses: $/.github/actions/setup-base-environment

            -   name: Test
                run: ./gradlew test

            -   name: Publish Test Report
                uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
                if: success() || failure()
                with:
                    report_paths: '**/build/test-results/test/TEST-*.xml'
                    require_tests: true

    # Kept apart from `test`, so a Codecov outage fails this job alone. The upload authenticates
    # with this job's OIDC token, so the job needs no environment and no secret.
    # `.github/codecov.yml` decides what the Codecov statuses check. Gradle runs on Java 25; the
    # tests still compile and run on the Java 21 toolchain that build.gradle.kts sets.
    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read # Required to checkout the code
            id-token: write # Required to authenticate the Codecov upload with OIDC
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
                with:
                    egress-policy: audit

            -   name: Run Coverage
                uses: TimSchoenle/actions/actions/java-gradle/coverage-codecov@e4229b81c3c3c880b9561dc4d53bd87ccf49eaf3 # tag=actions-java-gradle-coverage-codecov-v1.1.4
                with:
                    java_version: '25'
                    flags: java

    # Builds the native executable on every event, unsigned. Only a release is signed, in
    # release-please.yaml.
    #
    # On a pull request this job runs that pull request's code: `nativeBuild` runs its Gradle
    # wrapper, build scripts and plugins, and `$/` resolves the local actions from its commit. Code
    # running in a job can read every secret the job holds, so this job holds none and enters no
    # environment: a branch that edits this file cannot reach the signing key through it. The build
    # still proves the native executable works on every platform.
    native:
        name: Native(${{ matrix.os }})
        needs: [ test ]
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        permissions:
            contents: read # to read code
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
                with:
                    egress-policy: audit

            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    persist-credentials: false

            -   name: Build Native Executable
                id: native_build
                uses: $/.github/actions/build-native-with-graalvm

            -   name: Upload Native Artifact
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                if: success()
                with:
                    name: McDeob-Native-${{ runner.os }}-${{ runner.arch }}
                    path: ${{ steps.native_build.outputs.native_asset }}
                    if-no-files-found: error
